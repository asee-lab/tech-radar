                - button [ref=e568] [cursor=pointer]:
                  - generic: 12. DevOps
                - generic [ref=e569]:
                  - paragraph [ref=e570]: What
                  - list [ref=e571]:
                    - listitem [ref=e572]: DevOps is the combination of cultural practices, automation, and measurable operational processes (CI/CD, Infrastructure as Code, automated testing, observability, and continuous delivery) that enable fast, safe, repeatable delivery of software.
                  - paragraph [ref=e573]: Why now
                  - list [ref=e574]:
                    - listitem [ref=e575]: Business demands faster delivery and reliable operations. DevOps reduces lead time, increases deployment frequency and improves recovery time with small, testable changes and continuous feedback loops.
                  - paragraph [ref=e576]: When to adopt
                  - list [ref=e577]:
                    - listitem [ref=e578]: Adopt when you need faster iteration, better alignment between teams, predictable releases, and improved reliability. Start with CI, trunk-based development, automated tests, and progressive delivery; grow toward IaC, observability and SRE practices.
                  - paragraph [ref=e579]: Considerations
                  - list [ref=e580]:
                    - listitem [ref=e581]: "Culture change is the hardest part: invest in cross-functional teams, shared SLIs/SLOs, and blameless postmortems."
                    - listitem [ref=e582]: Prioritize automation and incremental rollout; avoid big-bang transformations.
                    - listitem [ref=e583]: "Secure by design: integrate security checks early (shift-left)."
                  - paragraph [ref=e584]: Key practices
                  - list [ref=e585]:
                    - listitem [ref=e586]: Continuous Integration / Continuous Delivery (CI/CD)
                    - listitem [ref=e587]: Infrastructure as Code (Terraform, CloudFormation)
                    - listitem [ref=e588]: Observability (metrics, logs, traces)
                    - listitem [ref=e589]: Trunk-based development and feature flags
                    - listitem [ref=e590]: Blameless postmortems and SLO-driven operations
                  - paragraph [ref=e591]: Further reading
