                    - text: .
                  - paragraph [ref=e506]:
                    - text: This is a foundation for
                    - link "Agentic Engineering" [ref=e507] [cursor=pointer]:
                      - /url: Agentic Engineering
                    - text: . If agentic workflows are expected to plan, edit, test, review, or coordinate work across tools, the quality of their context becomes part of the delivery system. Good context engineering uses patterns such as progressive context disclosure, agent skills, context packs, and feedback loops so agents receive enough information to act well without drowning in irrelevant instructions.
