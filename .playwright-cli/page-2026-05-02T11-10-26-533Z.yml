            - listitem [ref=e956]:
              - generic [ref=e957]:
                - button [ref=e958] [cursor=pointer]:
                  - generic: 30. Product Context Pack
                - generic [ref=e959]:
                  - paragraph [ref=e960]:
                    - text: A Product Context Pack packages a single product's complete knowledge — user guides, installation and operations documentation, API reference, business logic, database schemas and frontend code — into a vectorized, semantically searchable index that AI agents can query. The corpus is automatically chunked, embedded and refreshed as the product evolves, and is most commonly exposed through an
                    - link "This is an external link. Opens in new tab" [ref=e961] [cursor=pointer]:
                      - /url: https://modelcontextprotocol.io/
                      - text: MCP
                    - text: server so the same pack plugs into Claude Code, GitHub Copilot, Gemini CLI and any other MCP-capable client a team already uses. When a user asks a question, the pack combines semantic similarity with keyword matching to surface the right chunks across documentation and source, and lets the AI client synthesize a grounded answer with citations back to the original files.
                  - paragraph [ref=e962]: The value of the pattern is that every role around a product gets answers from the same source of truth. Sales and marketing pull benefit statements and feature descriptions for proposals; support and business analysts answer customer questions without digging through code; consultants and implementers find concrete setup and configuration steps; developers and system engineers get explanations backed by the actual implementation rather than just the manual. Because the index covers both written documentation and the codebase, a question like "how does retention policy work?" can return the user-facing concept, the business logic that evaluates it, the API endpoints that manage it and the database views that query it in one response.
                  - paragraph [ref=e963]:
                    - text: This pattern picks up where the previous radar's
                    - link "AI for codebase Q&A" [ref=e964] [cursor=pointer]:
                      - /url: ../../2025.10/PP/ai-for-codebase-qa.md
                    - text: "assessment left off, narrowing the corpus to a single product but widening the audience — covering documentation alongside source code, and serving business roles, not only developers. We place it in Assess because we have an early internal implementation covering small number of products and want to validate the pattern more broadly: how to keep the index fresh as code changes, how to scope and govern access (especially to source code) per audience, and how to measure answer quality across roles. It builds directly on"
                    - link "Context Engineering" [ref=e965] [cursor=pointer]:
                      - /url: Context Engineering
                    - text: and
                    - link "Progressive Context Disclosure" [ref=e966] [cursor=pointer]:
                      - /url: Progressive Context Disclosure
                    - text: ", and the cautions we raise in"
                    - link "Agent Skills" [ref=e967] [cursor=pointer]:
                      - /url: Agent Skills
                    - text: about defaulting to MCP still apply — for narrower, single-team needs a skill or local CLI is often the simpler fit.
                - button "Read more about Product Context Pack" [ref=e968] [cursor=pointer]: Read more
                - link "View blip history" [ref=e970] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Product%20Context%20Pack
