                - button [ref=e693] [cursor=pointer]:
                  - generic: 18. Agile Development
                - generic [ref=e694]:
                  - paragraph [ref=e695]:
                    - text: Agile development is an iterative and people-centric approach to software delivery, governed by the
                    - strong [ref=e696]: Agile Manifesto’s
                    - text: (
                    - link "This is an external link. Opens in new tab" [ref=e697] [cursor=pointer]:
                      - /url: https://agilemanifesto.org/
                      - text: https://agilemanifesto.org/
                    - text: ) four values and twelve principles. It prioritizes
                    - strong [ref=e698]: Individuals and interactions
                    - text: over processes and tools,
                    - strong [ref=e699]: Working software
                    - text: over comprehensive documentation,
                    - strong [ref=e700]: Customer collaboration
                    - text: over contract negotiation, and
                    - strong [ref=e701]: Responding to change
                    - text: over following a plan.
                  - paragraph [ref=e702]:
                    - text: Work is organized into short, fixed-length cycles (Sprints or iterations), enabling
                    - strong [ref=e703]: frequent feedback loops
                    - text: ","
                    - strong [ref=e704]: early validation
                    - text: ", and"
                    - strong [ref=e705]: continuous delivery
                    - text: of incremental value. Requirements are managed dynamically through a prioritized backlog, allowing teams to continuously refine scope based on business value, customer feedback, and emerging insights.
                  - paragraph [ref=e706]:
                    - text: Agile emphasizes not only delivery cadence, but also strong
                    - strong [ref=e707]: engineering practices
                    - text: such as continuous integration, automated testing, and regular refactoring to sustain long-term quality and adaptability.
                    - strong [ref=e708]: Continuous improvement
                    - text: is a core aspect, with teams regularly
                    - strong [ref=e709]: inspecting
                    - text: and
                    - strong [ref=e710]: adapting
                    - text: their ways of working through feedback mechanisms such as retrospectives.
                  - paragraph [ref=e711]:
                    - text: While Agile benefits are well established, its successful adoption depends on both organizational and team maturity. It requires active
                    - strong [ref=e712]: customer involvement
                    - text: ","
                    - strong [ref=e713]: empowered cross-functional teams
                    - text: ", and a shared understanding of"
                    - strong [ref=e714]: ownership
                    - text: and
                    - strong [ref=e715]: accountability
                    - text: . Simply adopting Agile ceremonies without embracing its underlying principles and engineering discipline can lead to scope creep, technical debt, reduced transparency, and lack of predictability.
                  - paragraph [ref=e716]:
                    - text: A new project should therefore selectively pilot Agile practices (such as daily stand-ups, short iterations, and continuous integration) to validate the team’s ability to operate within the
                    - strong [ref=e717]: Agile mindset
                    - text: before scaling its adoption.
                - button "Read more about Agile Development" [ref=e718] [cursor=pointer]: Read more
                - link "View blip history" [ref=e720] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Agile%20Development
