            - listitem [ref=e648]:
              - generic [ref=e649]:
                - button [ref=e650] [cursor=pointer]:
                  - generic: 16. Progressive Context Disclosure
                - generic [ref=e651]:
                  - paragraph [ref=e652]:
                    - text: Progressive context disclosure is a
                    - link "Context Engineering" [ref=e653] [cursor=pointer]:
                      - /url: Context Engineering
                    - text: technique that flips the usual instinct of front-loading every rule and reference an agent might ever need. Instead, the agent starts with a lightweight index of what's available — domains, tools, skills, documents — and only pulls the detailed material into its context window once it has seen the user's prompt and decided what is actually relevant. The result is a much higher signal-to-noise ratio per token spent.
                  - paragraph [ref=e654]:
                    - text: The pattern shows up in two places we already work with. In retrieval pipelines, the agent first decides which corner of the knowledge base matches the question and then retrieves the specific chunks it needs. In coding agents, it is how
                    - link "Agent Skills" [ref=e655] [cursor=pointer]:
                      - /url: Agent Skills
                    - text: "are loaded: the agent inspects skill descriptions, picks the few that fit the task, and only then reads their full instructions. This avoids the failure mode of an ever-growing monolithic prompt stuffed with conditional \"do this except when…\" rules, which models attend to less reliably as the context grows. Disclosing context progressively keeps the working window lean and helps the agent stay focused on the task at hand."
                - button "Read more about Progressive Context Disclosure" [ref=e656] [cursor=pointer]: Read more
                - link "View blip history" [ref=e658] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Progressive%20Context%20Disclosure
