                    - strong [ref=e1162]:
                      - link "This is an external link. Opens in new tab" [ref=e1163] [cursor=pointer]:
                        - /url: https://learn.microsoft.com/en-us/sql/sql-server/what-s-new-in-sql-server-2025
                        - text: SQL Server 2025
                    - text: "adds several features that make the platform more relevant for modern application workloads: native vector data types, vector indexes, and AI embedding functions for semantic search and retrieval-augmented generation scenarios; a native JSON data type with JSON aggregation support; regular expression and fuzzy string matching functions; and external REST endpoint invocation for integration with services such as Azure OpenAI."
