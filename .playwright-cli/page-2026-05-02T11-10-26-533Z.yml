              - generic [ref=e67]:
                - button [ref=e68] [cursor=pointer]:
                  - generic: 2. Agentic Engineering
                - generic [ref=e69]:
                  - paragraph [ref=e70]:
                    - text: "Agentic engineering is the discipline of designing software delivery around AI agents that can take meaningful action: exploring code, planning changes, editing files, running checks, reviewing results, and handing work back to humans with traceable evidence. It is not just \"AI-assisted coding\"; it treats agents as part of the engineering workflow, with clear responsibilities, guardrails, and feedback loops. These workflows are already practical for everyday engineering tasks when kept simple and bounded, as reflected in Anthropic's guidance on"
                    - link "This is an external link. Opens in new tab" [ref=e71] [cursor=pointer]:
                      - /url: https://www.anthropic.com/index/building-effective-agents
                      - text: building effective agents
                    - text: ", OpenAI's"
                    - link "This is an external link. Opens in new tab" [ref=e72] [cursor=pointer]:
                      - /url: https://openai.com/business/guides-and-resources/a-practical-guide-to-building-ai-agents
                      - text: practical guide to building agents
                    - text: ", and Cursor's"
                    - link "This is an external link. Opens in new tab" [ref=e73] [cursor=pointer]:
                      - /url: https://www.cursor.com/blog/agent-best-practices
                      - text: agent best practices
                    - text: .
                  - paragraph [ref=e74]:
                    - text: The practice depends heavily on
                    - link "Context Engineering" [ref=e75] [cursor=pointer]:
                      - /url: Context Engineering
                    - text: . Agents perform best when they receive curated project knowledge, task boundaries, tool instructions, and fast feedback from tests and linters. Teams adopting agentic engineering should therefore invest in reusable context, well-scoped agent skills, deterministic quality gates, and human review points, so autonomy increases without losing accountability.
                - button "Read more about Agentic Engineering" [ref=e76] [cursor=pointer]: Read more
                - link "View blip history" [ref=e78] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Agentic%20Engineering
                  - generic [ref=e79]: View blip history
                - generic [ref=e81]:
                  - generic [ref=e82]: Related blips
                  - list [ref=e83]:
