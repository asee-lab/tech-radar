                  - generic: 9. Context Engineering
                - generic [ref=e502]:
                  - paragraph [ref=e503]:
                    - text: "Context engineering is the practice of deliberately shaping the information an AI agent sees while it works: instructions, examples, repository knowledge, tool descriptions, feedback signals, and task-specific constraints. It moves teams beyond one-off prompt writing toward a repeatable engineering discipline for keeping the agent's context relevant, compact, and grounded in the actual system. Context quality is now one of the main factors that determines whether agentic workflows are reliable or noisy; useful references include OpenAI's guide to"
                    - link "This is an external link. Opens in new tab" [ref=e504] [cursor=pointer]:
