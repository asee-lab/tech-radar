                      - text: OpenSearch
                    - text: is an open-source search and analytics engine derived from Elasticsearch, commonly used for full-text search, log analytics, dashboards, and operational investigation over large event streams. It is relevant when teams need Elasticsearch-like capabilities while avoiding Elastic licensing constraints or when they want a community-governed stack. Teams already using
                    - link "Elasticsearch" [ref=e1249] [cursor=pointer]:
