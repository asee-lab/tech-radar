                    - text: ; it should be evaluated for mobile app flows where real device capabilities, platform APIs, permissions, and native UI behavior matter.
                  - paragraph [ref=e2136]: During assessment, teams should start with a narrow set of critical journeys and measure test reliability, execution time, maintenance cost, and debugging experience. Avoid broad end-to-end coverage until the team has proven stable locators, deterministic test data, repeatable device provisioning, and clear ownership for flaky tests.
