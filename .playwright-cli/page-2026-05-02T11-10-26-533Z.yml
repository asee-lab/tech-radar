                    - link "This is an external link. Opens in new tab" [ref=e1464] [cursor=pointer]:
                      - /url: https://istio.io/
                      - text: Istio
                    - text: is a Kubernetes service mesh that adds traffic management, mutual TLS, authorization policy, retries, canary routing, and service-to-service observability without pushing all of that logic into application code. Its capabilities are valuable for complex, security-sensitive microservice platforms, but the operational and cognitive cost is significant. Teams should consider Istio only when those service-to-service controls are clearly needed, not just because they run
                    - link "Kubernetes" [ref=e1465] [cursor=pointer]:
                      - /url: Kubernetes
                    - text: .
                  - paragraph [ref=e1466]:
                    - text: Evaluate Istio when a system has many services, strict zero-trust or compliance requirements, frequent progressive delivery needs, or a clear need for mesh-level telemetry and policy. For simpler systems, prefer well-configured ingress, API gateways, network policies, and application-level resilience before adding a mesh. A pilot should validate sidecar or ambient mode, performance overhead, certificate lifecycle, debugging workflows, integration with
                    - link "OpenTelemetry SDKs" [ref=e1467] [cursor=pointer]:
                      - /url: OpenTelemetry SDKs
                    - text: ", and whether alternatives such as Linkerd or Cilium service mesh would be easier to operate."
