            - listitem [ref=e796]:
              - generic [ref=e797]:
                - button [ref=e798] [cursor=pointer]:
                  - generic: 23. Feedback Flywheel
                - generic [ref=e799]:
                  - paragraph [ref=e800]:
                    - text: Most teams adopting coding agents settle into some variant of a spec → plan → implement workflow. The
                    - link "This is an external link. Opens in new tab" [ref=e801] [cursor=pointer]:
                      - /url: https://martinfowler.com/articles/reduce-friction-ai/#FivePatternsForAiCollaboration
                      - text: feedback flywheel
                    - text: "adds an explicit fourth step that closes the loop on the agent harness itself: after a session, capture what worked and what didn't, then improve the inputs to the next session. It is essentially a retrospective applied to the way the team collaborates with the agent, and the gains compound as the harness gets sharper over time."
                  - paragraph [ref=e802]:
                    - text: Concretely, the flywheel turns observed failures into changes to the things that drive future runs — the project's curated instructions, the
                    - link "Feedback Loops for Agents" [ref=e803] [cursor=pointer]:
                      - /url: Feedback Loops for Agents
                    - text: ", the prompt templates, the small skills the team relies on. A human is still on the loop here, deciding which signals are noise and which are systemic. The technique is particularly worth running every time a new model is rolled in: prompts and rules tuned for last quarter's model often add friction with the next one, and the flywheel is the cheapest way to find out which parts of the harness are still earning their place."
                - button "Read more about Feedback Flywheel" [ref=e804] [cursor=pointer]: Read more
                - link "View blip history" [ref=e806] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Feedback%20Flywheel
