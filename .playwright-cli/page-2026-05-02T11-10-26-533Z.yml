                  - generic: 32. Cloud Native Storage
                - paragraph [ref=e1040]:
                  - text: Cloud-native storage solutions have become critical components for running stateful applications in Kubernetes environments, providing persistent, scalable, and resilient storage that integrates seamlessly with container orchestration. We're seeing strong adoption of solutions like
                  - link "This is an external link. Opens in new tab" [ref=e1041] [cursor=pointer]:
                    - /url: https://rook.io/
                    - text: Rook-Ceph
                  - text: ", which automates Ceph storage cluster deployment and management in Kubernetes, providing block, file, and S3-compatible object storage capabilities, and"
                  - link "This is an external link. Opens in new tab" [ref=e1042] [cursor=pointer]:
                    - /url: https://longhorn.io/
                    - text: Longhorn
                  - text: ", a lightweight distributed block storage system originally developed by Rancher. Other notable open-source alternatives include"
                  - link "This is an external link. Opens in new tab" [ref=e1043] [cursor=pointer]:
                    - /url: https://openebs.io/
                    - text: OpenEBS
                  - text: ", which offers container-attached storage with multiple storage engines, and"
                  - link "This is an external link. Opens in new tab" [ref=e1044] [cursor=pointer]:
                    - /url: https://min.io/
                    - text: MinIO
                  - text: for object storage compatible with S3 APIs. These solutions provide flexibility and avoid vendor lock-in while delivering enterprise-grade features like replication, snapshots, and backup capabilities. For organizations preferring commercial support, solutions like
                  - link "This is an external link. Opens in new tab" [ref=e1045] [cursor=pointer]:
                    - /url: https://portworx.com/
                    - text: Portworx
                  - text: offer advanced features including disaster recovery and data security, while
                  - link "This is an external link. Opens in new tab" [ref=e1046] [cursor=pointer]:
                    - /url: https://www.purestorage.com/
                    - text: Pure Storage Portworx
                  - text: provides enterprise-grade storage with comprehensive support and SLAs. We're placing cloud-native storage in
                  - strong [ref=e1047]: adopt
                  - text: based on its maturity and necessity for production Kubernetes deployments. The key considerations are choosing the right solution based on workload requirements—block storage for databases, file storage for shared data, or object storage for unstructured data. Teams should evaluate performance requirements, operational complexity, and the trade-offs between self-managed open-source solutions and commercial offerings. Start with pilot projects to understand operational characteristics and ensure your team has the expertise to manage distributed storage systems. For organizations running stateful applications in Kubernetes, implementing a robust cloud-native storage solution is no longer optional but a fundamental requirement for production readiness.
                - button "Read more about Cloud Native Storage" [ref=e1048] [cursor=pointer]: Read more
                - link "View blip history" [ref=e1050] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Cloud%20Native%20Storage
