              - generic [ref=e1212]:
                - button [ref=e1213] [cursor=pointer]:
                  - generic: 41. Cassandra
                - generic [ref=e1214]:
                  - paragraph [ref=e1215]:
                    - link "This is an external link. Opens in new tab" [ref=e1216] [cursor=pointer]:
                      - /url: https://cassandra.apache.org/
                      - text: Apache Cassandra
                    - text: is a distributed, masterless wide-column NoSQL database built for big data workloads with extremely fast, scalable writes. Its peer-to-peer architecture, partitioned and replicated storage, and tunable consistency (per-query QUORUM, LOCAL_QUORUM, ONE, ALL) let teams scale horizontally across nodes and data centers while keeping predictable p99 write latency under heavy ingestion. Data is modeled query-first around partition and clustering keys, making Cassandra a strong fit for high-volume ingestion paths, event history, large-scale telemetry, and activity feeds where write throughput and continuous availability matter more than complex joins.
                  - paragraph [ref=e1217]: Cassandra is not a drop-in replacement for a relational database—there are no ad-hoc joins, transactions are limited to lightweight single-partition operations, and schema changes require care. Treat it as a purpose-built engine for write-heavy, scale-out workloads, and keep PostgreSQL or SQL Server as the default for transactional data.
                - button "Read more about Cassandra" [ref=e1218] [cursor=pointer]: Read more
                - link "View blip history" [ref=e1220] [cursor=pointer]:
