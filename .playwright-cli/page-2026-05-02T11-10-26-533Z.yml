                  - generic: 35. Kubernetes
                - generic [ref=e1079]:
                  - paragraph [ref=e1080]:
                    - link "This is an external link. Opens in new tab" [ref=e1081] [cursor=pointer]:
                      - /url: https://kubernetes.io/
                      - text: Kubernetes
                    - text: is an orchestration platform that schedules and manages containerized workloads through declarative APIs. Deployments, StatefulSets, and Jobs describe desired state; the control plane reconciles actual state continuously. Service discovery, rolling updates, horizontal and vertical autoscaling, and self-healing provide robust day-to-day operations. A rich extension model—CRDs, operators, CSI for storage, CNI for networking, and Ingress/Gateway for traffic—supports diverse workloads from stateless web services to databases. Security and multi-tenancy benefit from namespaces, RBAC, network policies, and admission control. Effective clusters pair resource requests/limits with pod disruption budgets and readiness probes to enable safe rollouts. Observability integrates metrics, logs, and traces, commonly via Prometheus, centralized logging, and OpenTelemetry. Kubernetes standardizes deployment and runtime behavior across environments, enabling consistent delivery practices at scale.
                  - paragraph [ref=e1082]:
                    - strong [ref=e1083]: "Warning on microK8s:"
                    - text: we have hit recurring operational issues (snap-driven upgrades, node recovery, addon lifecycle, HA edge cases) and do
                    - strong [ref=e1084]: not
                    - text: recommend it for production until clarified. A meeting with
                    - strong [ref=e1085]: Canonical
                    - text: is being scheduled to align on supported topologies and the recommended path forward.
