                - button [ref=e1066] [cursor=pointer]:
                  - generic: 34. Keycloak
                - paragraph [ref=e1068]:
                  - link "This is an external link. Opens in new tab" [ref=e1069] [cursor=pointer]:
                    - /url: https://www.keycloak.org/
                    - text: Keycloak
                  - text: is an open-source identity and access management solution that provides comprehensive authentication and authorization capabilities for modern applications. We've seen Keycloak mature into a robust platform that supports industry-standard protocols including OpenID Connect, OAuth 2.0, and SAML 2.0, making it suitable for both new applications and legacy system integration. The platform offers features like single sign-on (SSO), social login integration, user federation with LDAP/Active Directory, multi-factor authentication, and fine-grained authorization policies. Teams appreciate Keycloak's admin console for managing users, roles, and clients, along with its extensive customization options through themes and service provider interfaces. We're placing Keycloak in
                  - strong [ref=e1070]: adopt
                  - text: based on its proven track record across our projects. It significantly reduces the complexity and development effort required to implement secure authentication and authorization, while providing enterprise-grade features out of the box. The main considerations are proper infrastructure sizing for high-availability deployments and understanding its operational requirements. Organizations should invest in learning Keycloak's realm and client configuration patterns, as proper setup is crucial for security and maintainability. For teams building applications that require authentication, Keycloak eliminates the need to build these capabilities from scratch and provides a battle-tested foundation for identity management.
                - button "Read more about Keycloak" [ref=e1071] [cursor=pointer]: Read more
