                - button [ref=e1107] [cursor=pointer]:
                  - generic: 37. NGINX
                - generic [ref=e1108]:
                  - paragraph [ref=e1109]: NGINX is a high-performance HTTP server and reverse proxy widely used for load balancing, TLS termination, static content delivery, and as an edge gateway. It scales well with modest resource use, has a small operational footprint, and integrates smoothly with container orchestration and CI/CD pipelines.
                  - paragraph [ref=e1110]: When to use
                  - list [ref=e1111]:
                    - listitem [ref=e1112]: Front your services with NGINX for reliable TLS termination and layer 7 routing.
                    - listitem [ref=e1113]: Use as a performant static file server or as an ingress controller in Kubernetes.
                    - listitem [ref=e1114]: Prefer NGINX when predictable high concurrency and low-latency routing are required.
                  - paragraph [ref=e1115]: Advice and trade-offs
                  - list [ref=e1116]:
                    - listitem [ref=e1117]: Adopt default NGINX for most edge and proxy needs; use NGINX Plus only when enterprise features or vendor support are required.
                    - listitem [ref=e1118]: Invest in secure default configs (rate limiting, header sanitization, TLS hardening) and automated config testing.
                    - listitem [ref=e1119]: For advanced API gateway features consider combining with dedicated gateway solutions; for simple use-cases NGINX is often sufficient.
                  - paragraph [ref=e1120]: "Kubernetes ingress controllers There are two well-supported, production-ready NGINX-based ingress controllers, and it is worth knowing they are distinct projects:"
                  - list [ref=e1121]:
                    - listitem [ref=e1122]: "ingress-nginx (kubernetes/ingress-nginx): the community controller maintained under the Kubernetes project. It is the most widely deployed NGINX ingress in the wild, well-documented, and a solid default for most clusters."
                    - listitem [ref=e1123]: "NGINX Ingress Controller (nginxinc/kubernetes-ingress): maintained by NGINX/F5. It ships in two flavors — an open-source build on top of NGINX OSS and a commercial build on top of NGINX Plus. Beyond the standard Ingress API, it exposes its own CRDs (VirtualServer, VirtualServerRoute, TransportServer, Policy) for richer traffic management, supports dynamic reconfiguration without reloads, active health checks, JWT/OIDC authentication, and advanced load-balancing methods. The Plus variant adds commercial support and a real-time monitoring dashboard. Both are reasonable choices. Pick the community ingress-nginx for a familiar, broadly adopted default; pick the NGINX-provided controller when you want first-party CRDs, reload-free config updates, or the NGINX Plus feature set and support contract."
