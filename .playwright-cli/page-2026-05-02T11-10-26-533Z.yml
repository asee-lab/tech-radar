                  - generic: 1. Agent Skills
                - generic [ref=e42]:
                  - paragraph [ref=e43]:
                    - text: As AI agents evolve from simple chat interfaces toward autonomous task execution,
                    - link "Context Engineering" [ref=e44] [cursor=pointer]:
                      - /url: Context Engineering
                    - text: has become a critical challenge.
                    - link "This is an external link. Opens in new tab" [ref=e45] [cursor=pointer]:
                      - /url: https://agentskills.io/
                      - text: Agent Skills
                    - text: provide an open standard for modularizing context by packaging instructions, executable scripts and associated resources such as documentation. Agents load skills only when needed based on their descriptions, which reduces token consumption and mitigates context window exhaustion and problems such as agent instruction bloat.
                  - paragraph [ref=e46]:
                    - text: Skills have been adopted very quickly, not only in coding agents but also in personal assistants such as
                    - link "This is an external link. Opens in new tab" [ref=e47] [cursor=pointer]:
                      - /url: https://openclaw.ai/
                      - text: OpenClaw
                    - text: . They're also one reason teams are becoming more cautious about defaulting to MCP, as many use cases can be addressed just as effectively by pointing an agent at a local CLI or script.
                  - paragraph [ref=e48]:
                    - text: As their popularity has grown, the surrounding ecosystem has expanded as well. Plugin marketplaces such as one for
                    - link "This is an external link. Opens in new tab" [ref=e49] [cursor=pointer]:
                      - /url: https://code.claude.com/docs/en/plugin-marketplaces
                      - text: Claude
                    - text: ","
                    - link "This is an external link. Opens in new tab" [ref=e50] [cursor=pointer]:
                      - /url: https://developers.openai.com/codex/plugins
                      - text: Codex
                    - text: and
                    - link "This is an external link. Opens in new tab" [ref=e51] [cursor=pointer]:
                      - /url: https://cursor.com/docs/plugins
                      - text: Cursor
                    - text: are emerging as a way to package, version and share skills, commands, MCP server integrations, and multiple efforts are exploring how to
                    - link "This is an external link. Opens in new tab" [ref=e52] [cursor=pointer]:
                      - /url: https://agentskills.io/skill-creation/evaluating-skills
                      - text: evaluate skill
                    - text: effectiveness. We do, however, caution against unreviewed reuse of third-party skills, as they introduce serious
                    - link "This is an external link. Opens in new tab" [ref=e53] [cursor=pointer]:
                      - /url: https://snyk.io/blog/toxicskills-malicious-ai-agent-skills-clawhub/
                      - text: supply chain security risks
                    - text: .
