                  - generic: 48. Cillium
                - generic [ref=e1385]:
                  - paragraph [ref=e1386]:
                    - link "This is an external link. Opens in new tab" [ref=e1387] [cursor=pointer]:
                      - /url: https://cilium.io/
                      - text: Cilium
                    - text: is an eBPF-based CNI for
                    - link "Kubernetes" [ref=e1388] [cursor=pointer]:
                      - /url: Kubernetes
                    - text: that replaces traditional iptables-driven networking with kernel-level data planes for Pod connectivity, Service load balancing, NetworkPolicy enforcement and observability. Because rules are compiled to eBPF and applied directly in the kernel, Cilium scales policy and service handling far better than iptables under high pod churn or large service counts, and exposes rich L3/L4 and L7-aware policies (HTTP, gRPC,
                    - link "Kafka" [ref=e1389] [cursor=pointer]:
                      - /url: Kafka
                    - text: ) without sidecars.
                    - link "This is an external link. Opens in new tab" [ref=e1390] [cursor=pointer]:
                      - /url: https://github.com/cilium/hubble
                      - text: Hubble
                    - text: ships with it as a flow-level observability layer — every packet, drop and policy decision is visible by workload identity rather than by IP, which is a noticeable step up from what we get from a default CNI today. Beyond networking, Cilium also offers a sidecar-less service mesh and transparent encryption (WireGuard or IPsec), positioning it as an alternative to running a full
                    - link "Istio" [ref=e1391] [cursor=pointer]:
                      - /url: Istio
                    - text: stack for many use cases. It can replace also ingress controller in Kubernetes cluster with a limitation related to passthrough SSL communication which is not supported.
                  - paragraph [ref=e1392]:
                    - text: We are placing Cilium in
                    - strong [ref=e1393]: assess
                    - text: because eBPF is the direction the Kubernetes ecosystem is clearly moving and the security and observability story is genuinely compelling, but adopting it touches the most sensitive layer of a cluster and demands a clear migration plan. What to validate is kernel version requirements across our distributions and managed Kubernetes offerings (eBPF features depend on a recent enough kernel), behavior of existing NetworkPolicies under Cilium semantics, performance on east-west traffic for our microservices workloads, and the operational story for upgrades, debugging dropped flows and integrating Hubble with our
                    - link "Grafana stack" [ref=e1394] [cursor=pointer]:
                      - /url: Grafana stack
                    - text: . Before any production move, run it on a non-critical cluster and compare against the current CNI on real workloads — the headline benefits only matter if they survive contact with our actual traffic patterns.
