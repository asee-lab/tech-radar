                      - text: Apache Spark
                    - text: is a mature distributed data processing engine for large-scale batch ETL, stream processing, machine learning pipelines, and data transformations that exceed the practical limits of a single database or application service. It is a proven standard for data-heavy workloads, but it also brings operational complexity, resource tuning, and cost management responsibilities that teams should understand before making it the default.
                  - paragraph [ref=e1327]:
                    - text: Use Spark when workloads require parallel processing across large datasets, especially in lakehouse architectures using
