                - button [ref=e1292] [cursor=pointer]:
                  - generic: 45. S3 Compatible Object Storage
                - generic [ref=e1293]:
                  - paragraph [ref=e1294]:
                    - text: Object storage manages data as objects with metadata and unique identifiers, in contrast to hierarchical file systems or block storage.
                    - link "This is an external link. Opens in new tab" [ref=e1295] [cursor=pointer]:
                      - /url: https://aws.amazon.com/s3/
                      - text: S3
                    - text: ", AWS's object storage service, has become the de facto standard, and its API is widely implemented by cloud providers and storage vendors — making it a portable foundation rather than a vendor-specific commitment."
                  - heading "When to Use It" [level=2] [ref=e1296]
                  - paragraph [ref=e1297]: "S3-compatible object storage is well suited to unstructured data accessed over HTTP at scale: data lakes, backups and archives, ML training datasets, log retention, static web assets, and large media. It is generally a poor fit for low-latency transactional workloads or anything that needs POSIX semantics — block storage or a managed file system will serve those better. Be aware of the trade-offs: higher per-operation latency than block storage, eventual consistency in some implementations, and a cost model driven by request count and egress rather than provisioned capacity."
                  - heading "Landscape Considerations" [level=2] [ref=e1298]
                  - paragraph [ref=e1299]:
                    - text: For cloud-native deployments,
                    - link "Cloud Native Storage" [ref=e1300] [cursor=pointer]:
                      - /url: Cloud Native Storage
                    - text: provide S3-compatible object storage for
                    - link "Kubernetes" [ref=e1301] [cursor=pointer]:
                      - /url: Kubernetes
                    - text: "environments. The open-source landscape has shifted notably: MinIO, previously a default choice, has scaled back its community edition — most web console features were removed and AGPL terms are being enforced more aggressively, prompting many teams to reassess. This underscores the importance of evaluating licensing stability, vendor lock-in risk, and long-term community governance when picking an implementation."
                    - link "This is an external link. Opens in new tab" [ref=e1302] [cursor=pointer]:
                      - /url: https://www.rustfs.io/
                      - text: RustFS
                    - text: is an emerging alternative worth monitoring, though still early. Prioritize solutions with transparent, stable licensing to preserve operational independence.
                  - heading "Adoption Recommendation" [level=2] [ref=e1303]
                  - paragraph [ref=e1304]: S3-compatible object storage is worth piloting as the standard for unstructured data, with implementation chosen to fit the deployment context. For cloud-native environments, evaluate open-source options carefully against the licensing concerns above. For enterprise on-prem setups, Hitachi Content Platform is one mature option — it supports Virtual Appliance, dedicated hardware, and multitenant deployments, which can be useful where resource isolation and independent billing across tenants matter. Choose based on workload profile, deployment constraints, and the licensing posture you can live with long-term.
                - button "Read more about S3 Compatible Object Storage" [ref=e1305] [cursor=pointer]: Read more
                - link "View blip history" [ref=e1307] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=S3%20Compatible%20Object%20Storage
