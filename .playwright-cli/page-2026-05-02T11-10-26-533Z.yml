            - listitem [ref=e816]:
              - generic [ref=e817]:
                - button [ref=e818] [cursor=pointer]:
                  - generic: 24. Microservices
                - paragraph [ref=e820]:
                  - link "This is an external link. Opens in new tab" [ref=e821] [cursor=pointer]:
                    - /url: https://microservices.io/
                    - text: Microservices
                  - text: is an architectural style that organizes software into small, independently deployable services with clear bounded contexts. Each service owns its data and exposes contracts through APIs or events, enabling teams to iterate and scale components separately. Communication favors asynchronous messaging for decoupling and resilience, with synchronous calls reserved for request/response needs and protected by timeouts, retries, and circuit breakers. Operational autonomy improves when services publish uniform health endpoints, metrics, and traces, allowing platform tooling to automate rollouts and failure handling. The approach introduces new responsibilities—contract versioning, schema evolution, cross-service debugging, and eventual consistency—mitigated by patterns such as outbox/CDC, sagas for multi-step flows, and schema registries. Microservices fit best where domain boundaries are strong and deployment velocity matters more than in-process calls.
                - button "Read more about Microservices" [ref=e822] [cursor=pointer]: Read more
                - link "View blip history" [ref=e824] [cursor=pointer]:
