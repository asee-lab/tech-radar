                    - link "This is an external link. Opens in new tab" [ref=e1516] [cursor=pointer]:
                      - /url: https://trino.io/
                      - text: Trino
                    - text: (formerly PrestoSQL) is a highly parallel and distributed SQL query engine designed for fast, interactive analytics over data that lives outside a traditional database — object storage, lakehouse tables, relational engines, message logs — without first copying it into a warehouse. A coordinator plans queries, workers execute them in parallel against pluggable connectors, and the engine's strength is
                    - strong [ref=e1517]: federation
                    - text: ": a single SQL query can join an"
                    - link "Iceberg" [ref=e1518] [cursor=pointer]:
                      - /url: Iceberg
                    - text: table on object storage with a transactional table in
                    - link "PostgreSQL" [ref=e1519] [cursor=pointer]:
                      - /url: PostgreSQL
                    - text: and a topic in
                    - link "Kafka" [ref=e1520] [cursor=pointer]:
                      - /url: Kafka
                    - text: ", which is exactly the shape of question that today usually triggers a bespoke ETL job. Compute is decoupled from storage, so clusters can be scaled horizontally for query concurrency and turned off when idle."
                  - paragraph [ref=e1521]:
                    - text: We are placing Trino in
                    - strong [ref=e1522]: assess
                    - text: as the natural query layer for the
                    - link "Lakehouse" [ref=e1523] [cursor=pointer]:
                      - /url: Lakehouse
                    - text: pattern and as a candidate for ad-hoc analytics across our existing systems of record. The headline value is opening up data already on
                    - link "S3 Compatible Object Storage" [ref=e1524] [cursor=pointer]:
                      - /url: S3 Compatible Object Storage
                    - text: "to SQL users without a separate warehouse, but the practical questions are operational: catalog and access management across many connectors, memory and concurrency tuning, query cost control under multi-tenant use, and how to keep dashboards stable when source systems change. Trino is not a system of record and not a substitute for"
                    - link "Spark" [ref=e1525] [cursor=pointer]:
                      - /url: Spark
                    - text: on heavy batch transformations — pick it where interactive latency over large, cold data matters, and validate first that one realistic dashboard workload survives a representative day of concurrent users before investing in a wider rollout.
