                  - generic: 70. Shared credentials management
                - generic [ref=e1924]:
                  - paragraph [ref=e1925]:
                    - text: Centralised credentials and secret management provides secure storage, fine-grained access control, rotation and auditability for the secrets used by applications and platform components. It decouples secret lifecycle from application code, removes long-lived credentials from manifests and pipelines, and is now a
                    - strong [ref=e1926]: de facto standard enterprise practice
                    - text: driven by security, compliance and multi-cloud/Kubernetes adoption.
                  - paragraph [ref=e1927]:
                    - text: We are moving this blip to
                    - strong [ref=e1928]: Adopt
                    - text: and recommending
                    - link "This is an external link. Opens in new tab" [ref=e1929] [cursor=pointer]:
                      - /url: https://www.vaultproject.io/
                      - strong [ref=e1930]: HashiCorp Vault
                    - text: "as the standard backend for teams across the group. Vault gives us a mature, well-understood platform for organisation-wide secrets, cross-team reuse, automated rotation and dynamic, short-lived credentials, with strong audit trails. For Kubernetes workloads, integrate Vault through external-secrets or a CSI provider rather than embedding long-lived secrets in manifests, and apply least-privilege policies from day one. Plan for the operational realities—HA, backups, secret leasing, secure injection patterns—and avoid over-broad roles, secret sprawl, and high-cardinality telemetry on secret access. References:"
                    - link "This is an external link. Opens in new tab" [ref=e1931] [cursor=pointer]:
                      - /url: https://www.vaultproject.io/
