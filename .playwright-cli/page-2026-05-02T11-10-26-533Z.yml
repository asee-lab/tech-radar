                  - paragraph [ref=e2536]: Quarkus is a Kubernetes-native Java framework that optimises for fast startup, low memory usage, and developer productivity (live reload, unified configuration). It supports GraalVM native images and integrates with Jakarta EE, MicroProfile and popular libraries.
                  - paragraph [ref=e2537]: When to use
                  - list [ref=e2538]:
                    - listitem [ref=e2539]: New greenfield microservices, serverless functions or services where startup time and memory matter.
                  - paragraph [ref=e2540]: Trade-offs
                  - list [ref=e2541]:
                    - listitem [ref=e2542]: Native-image builds increase CI complexity and time; some libraries need adaptation for native mode.
