                  - generic: 51. Micro VM Runtimes
                - paragraph [ref=e1488]:
                  - strong [ref=e1489]: Micro VM container runtimes
                  - text: (
                  - link "This is an external link. Opens in new tab" [ref=e1490] [cursor=pointer]:
                    - /url: https://firecracker-microvm.github.io/
                    - text: Firecracker
                  - text: ","
                  - link "This is an external link. Opens in new tab" [ref=e1491] [cursor=pointer]:
                    - /url: https://katacontainers.io/
                    - text: Kata Containers
                  - text: ","
                  - link "This is an external link. Opens in new tab" [ref=e1492] [cursor=pointer]:
                    - /url: https://www.cloudhypervisor.org/
                    - text: Cloud Hypervisor
                  - text: ) run each container inside a lightweight virtual machine instead of sharing the host kernel. They keep the OCI/CRI interfaces and Kubernetes integration that operators already know, but trade a small amount of startup time and density for hardware-level isolation, a much smaller attack surface than shared-kernel runtimes, and stronger noisy-neighbour guarantees. Boot times in the tens to low hundreds of milliseconds and per-VM memory overhead in the low tens of MB make them practical for general workloads, not just specialised ones. We treat this as a
                  - strong [ref=e1493]: category
                  - text: "rather than a single product: the right choice depends on the workload (Firecracker for fast, minimal serverless-style isolation; Kata for drop-in OCI/Kubernetes use; Cloud Hypervisor where richer device support matters). We are putting it in"
                  - strong [ref=e1494]: Assess
                  - text: to evaluate it for multi-tenant clusters, untrusted code paths (CI runners, customer-supplied workloads, plugin/agent execution), and regulated environments where stronger isolation is a hard requirement; what to validate is performance overhead on representative workloads, integration with our Kubernetes distributions and CNI/CSI choices, image and kernel lifecycle management, and the operational story for debugging, observability and incident response.
