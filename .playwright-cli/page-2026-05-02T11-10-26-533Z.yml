                - button [ref=e403] [cursor=pointer]:
                  - generic: 6. API First
                - generic [ref=e404]:
                  - paragraph [ref=e405]:
                    - link "This is an external link. Opens in new tab" [ref=e406] [cursor=pointer]:
                      - /url: https://www.postman.com/api-first
                      - text: API First
                    - text: is an approach to software design where APIs are treated as first-class citizens and defined before any implementation begins. Instead of building an application and then exposing APIs as an afterthought, teams start by designing the API contract—often using specifications like OpenAPI or AsyncAPI—to ensure clarity, consistency, and interoperability.
                  - paragraph [ref=e407]:
                    - text: This approach is currently used succesfully by many teams in our group, and we encourage others to try it in their future projects. Designing APIs first promotes
                    - strong [ref=e408]: consumer-driven design
                    - text: ", enabling"
                    - strong [ref=e409]: parallel development across teams
                    - text: ", better"
                    - strong [ref=e410]: alignment with business requirements
                    - text: ", and seamless"
                    - strong [ref=e411]: integration within distributed or microservices architectures
                    - text: . It also supports automated workflows such as
                    - strong [ref=e412]: mock servers
                    - text: ","
                    - link "Contract testing" [ref=e413] [cursor=pointer]:
                      - /url: Contract testing
                    - text: ", and"
                    - strong [ref=e414]: code generation
                    - text: ", helping reduce errors and accelerate delivery. By prioritizing APIs early, organizations create more"
                    - strong [ref=e415]: maintainable
                    - text: ","
                    - strong [ref=e416]: scalable
                    - text: ", and"
                    - strong [ref=e417]: reusable services
                    - text: ", which is critical for modern ecosystems where APIs are the backbone of digital platforms."
                  - paragraph [ref=e418]:
                    - text: API First is also becoming a critical foundation for working effectively with AI. A well-defined OpenAPI or AsyncAPI specification gives coding agents a precise, machine-readable contract they can reason about, generate clients and servers from, and validate their output against. The same contract powers
                    - strong [ref=e419]: MCP servers
                    - text: and
                    - strong [ref=e420]: tool definitions
                    - text: exposed to agents, ensures
                    - strong [ref=e421]: AI-generated implementations stay aligned
                    - text: with the agreed interface, and integrates naturally with
                    - link "Feedback Loops for Agents" [ref=e422] [cursor=pointer]:
                      - /url: Feedback Loops for Agents
                    - text: and
                    - link "Contract testing" [ref=e423] [cursor=pointer]:
                      - /url: Contract testing
                    - text: so that drift is caught immediately. In an era where AI accelerates code production, the API contract becomes the source of truth that keeps humans, agents, and services speaking the same language.
                - button "Read more about API First" [ref=e424] [cursor=pointer]: Read more
                - link "View blip history" [ref=e426] [cursor=pointer]:
