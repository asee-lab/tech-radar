                  - generic: 95. Cypress
                - generic [ref=e2514]:
                  - paragraph [ref=e2515]:
                    - link "This is an external link. Opens in new tab" [ref=e2516] [cursor=pointer]:
                      - /url: https://www.cypress.io/
                      - text: Cypress
                    - text: is a JavaScript-based end-to-end testing framework that runs directly in the browser, offering a fundamentally different architecture from traditional Selenium-based tools. We're seeing increasing interest in Cypress due to its developer-friendly API, automatic waiting mechanisms, and superior debugging capabilities with time-travel snapshots. The framework excels at testing modern single-page applications and provides built-in support for API testing alongside UI tests. However, teams should be aware of its browser limitations—while it supports Chrome, Edge, and Firefox well, Safari support remains limited to paid tiers.
                  - paragraph [ref=e2517]:
                    - text: We're moving Cypress to
                    - strong [ref=e2518]: trial
                    - text: as multiple teams have adopted it on greenfield projects and seen real gains in test reliability, debugging speed and developer experience over Selenium-era tools. Projects with existing Selenium investments should still weigh migration effort and team training; teams choosing between Cypress and
                    - link "Playwright" [ref=e2519] [cursor=pointer]:
                      - /url: Playwright
                    - text: should compare cross-browser support and runtime architecture against their app's needs. Despite these considerations, Cypress's architecture addresses many pain points of traditional E2E testing, making it a compelling option for teams struggling with test reliability and maintenance overhead.
                - button "Read more about Cypress" [ref=e2520] [cursor=pointer]: Read more
                - link "View blip history" [ref=e2522] [cursor=pointer]:
