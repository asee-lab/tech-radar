                  - paragraph [ref=e313]:
                    - text: "The compounding effect matters more than any single pattern. Generated scenarios feed generated automation; consistent automation produces clean run history; clean history makes triage AI's signal sharp; sharp signal frees QA effort to invest in exploratory and security testing where AI is still a junior partner. AI for verification leans on the same foundations as the rest of the AI practice on this radar:"
