              - generic [ref=e441]:
                - button [ref=e442] [cursor=pointer]:
                  - generic: 7. Automated Dependency Updates
                - generic [ref=e443]:
                  - paragraph [ref=e444]: Automated Dependency Updates is a key technique in modern software development. It involves tools that automatically detect outdated dependencies, create automated pull requests (PRs) for updates, and often incorporate security vulnerability scanning to reduce maintenance burden and mitigate supply chain risks.
                  - paragraph [ref=e445]: With the widespread usage of AI tools, dependencies update frequently, creating a constant need for timely patches to maintain security.
                  - paragraph [ref=e446]: Dependabot (GitHub) Native GitHub tool that automatically generates version and security update PRs. Supports 20+ package managers. Free for public repositories and included in GitHub plans for private ones.
                  - paragraph [ref=e447]: Renovate (Mend Renovate) Highly configurable open-source tool (AGPL) supporting over 90 package managers and multiple platforms (GitHub, GitLab, Bitbucket, Azure DevOps). Excellent monorepo and customization support. Free self-hosted/on-premise deployment (CLI/Docker) under AGPL, ideal for internal or air-gapped setups; enterprise options for advanced features.
                  - paragraph [ref=e448]: Dependabot is a reliable baseline solution for GitHub-based teams, for on premise self-hosted installations go for Renovate.
                - button "Read more about Automated Dependency Updates" [ref=e449] [cursor=pointer]: Read more
                - link "View blip history" [ref=e451] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Automated%20Dependency%20Updates
                  - generic [ref=e452]: View blip history
            - listitem [ref=e454]:
              - generic [ref=e455]:
                - button [ref=e456] [cursor=pointer]:
                  - generic: 8. Clean Architecture
                - generic [ref=e457]:
                  - paragraph [ref=e458]:
                    - link "This is an external link. Opens in new tab" [ref=e459] [cursor=pointer]:
                      - /url: https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
                      - text: Clean Architecture
                    - text: is a software design approach that emphasizes separation of concerns, independence from frameworks, and testability by organizing code into concentric layers with strict dependency rules. The core principle is that dependencies point inward toward business logic, ensuring the domain layer remains independent of external concerns like UI, databases, or frameworks. Various implementations exist including
                    - strong [ref=e460]: layered architecture
                    - text: ","
                    - strong [ref=e461]: hexagonal architecture
                    - text: ", and"
                    - strong [ref=e462]: ports and adapters
                    - text: patterns, all sharing the goal of decoupling business rules from infrastructure details.
                  - paragraph [ref=e463]:
                    - text: Clean Architecture provides significant benefits including improved testability through isolated business logic, flexibility to swap frameworks or databases without impacting core functionality, and clearer code organization that aids long-term maintainability. Teams adopting these patterns consistently report better separation between domain logic and technical implementation, making systems easier to understand, modify, and extend. We're placing Clean Architecture in
                    - strong [ref=e464]: adopt
                    - text: based on its proven effectiveness across projects of varying sizes and complexity. Teams should apply these principles pragmatically, understanding that the investment in proper layering and dependency management pays dividends through reduced coupling and enhanced maintainability. For new projects and major refactoring efforts, particularly with frameworks like
                    - link "Spring Boot" [ref=e465] [cursor=pointer]:
                      - /url: Spring Boot
                    - text: ", Clean Architecture provides a solid foundation for building sustainable, evolvable systems."
                  - paragraph [ref=e466]:
                    - text: Clean Architecture takes on renewed importance as AI accelerates code production. Agents work best against codebases with clear seams; without them, AI-generated code drifts into layer violations that erode the team's shared mental model — exactly the
                    - link "Codebase Cognitive Debt" [ref=e467] [cursor=pointer]:
                      - /url: Codebase Cognitive Debt
                    - text: we want to avoid. Clear layering also makes
                    - link "Context Engineering" [ref=e468] [cursor=pointer]:
                      - /url: Context Engineering
                    - text: tractable (an agent can be fed a focused slice rather than the whole repository) and lets architectural rules run as part of
                    - link "Feedback Loops for Agents" [ref=e469] [cursor=pointer]:
                      - /url: Feedback Loops for Agents
                    - text: — see
                    - link "Architecture as Code" [ref=e470] [cursor=pointer]:
                      - /url: Architecture as Code
                    - text: for the enforcement story.
                - button "Read more about Clean Architecture" [ref=e471] [cursor=pointer]: Read more
                - link "View blip history" [ref=e473] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Clean%20Architecture
                  - generic [ref=e474]: View blip history
                - generic [ref=e476]:
                  - generic [ref=e477]: Related blips
