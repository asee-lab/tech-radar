                  - generic: 21. Event-driven architecture
                - generic [ref=e775]:
                  - paragraph [ref=e776]:
                    - link "This is an external link. Opens in new tab" [ref=e777] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Event-driven_architecture
                      - text: Event-driven architecture
                    - text: is a software design pattern where components react to and communicate through events—changes in system state—rather than direct synchronous requests. Producers emit events without needing to know who will consume them, and consumers respond asynchronously, with only the event format acting as a shared contract. The result is a loosely coupled, scalable, and resilient system that can react to information in real time.
                  - paragraph [ref=e778]: "Because dependencies are reduced to the event schema, services can be updated, replaced, or scaled independently based on their event load, and a temporary outage of a consumer is absorbed by the broker until it recovers—making the system naturally fault-tolerant and a strong fit for use cases like fraud detection, inventory management, and personalized user experiences. In practice the pattern also pairs exceptionally well with AI-assisted development: each microservice stays small, focused, and easy to integrate, which lets AI agents lead day-to-day implementation while the system design engineer absorbs the architectural complexity—enabling junior developers and AI agents to deliver complex systems together. Evolving the design within the same pattern is equally straightforward; swapping a consumer, adding a new reaction to an existing event, or extending a flow rarely ripples beyond the touched component, so iteration stays cheap as the system grows."
                - button "Read more about Event-driven architecture" [ref=e779] [cursor=pointer]: Read more
                - link "View blip history" [ref=e781] [cursor=pointer]:
