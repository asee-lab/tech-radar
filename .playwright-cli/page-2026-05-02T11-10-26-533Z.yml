                - button [ref=e1055] [cursor=pointer]:
                  - generic: 33. Kafka
                - paragraph [ref=e1057]:
                  - link "This is an external link. Opens in new tab" [ref=e1058] [cursor=pointer]:
                    - /url: https://kafka.apache.org/
                    - text: Apache Kafka
                  - text: provides a durable, high-throughput event log that decouples producers from consumers. Topics are partitioned for scale and replicated for fault tolerance, allowing independent services to publish and subscribe without direct knowledge of each other.Backpressure is handled naturally by consumer offsets, and replay is as simple as re-reading from an earlier offset. Schema enforcement with Avro or Protobuf protects compatibility, while compaction and retention policies align storage with business semantics. Common patterns include event-driven integration, change-data-capture pipelines, streaming ETL, and audit trails. Healthy clusters maintain in-sync replicas, even partition distribution, and predictable latency; observability centers on controller state, request timing, consumer lag, and under-replicated partitions. Exactly-once processing exists for narrow paths, yet most designs rely on idempotent producers and consumers for simplicity and resilience.
                - button "Read more about Kafka" [ref=e1059] [cursor=pointer]: Read more
                - link "View blip history" [ref=e1061] [cursor=pointer]:
