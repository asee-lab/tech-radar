            - listitem [ref=e784]:
              - generic [ref=e785]:
                - button [ref=e786] [cursor=pointer]:
                  - generic: 22. Factory acceptance testing
                - generic [ref=e787]:
                  - paragraph [ref=e788]:
                    - text: Factory Acceptance Testing (FAT), is a pre-shipment process where deliverables are tested by vendor to verify it meets all specifications, design criteria, and functional requirements before being released to the market. When a product team delivers a packaged software for on-premises deployment,
                    - strong [ref=e789]: factory acceptance testing (FAT)
                    - text: ensures that product deliverables operate correctly in a realistic, production-like environment. FAT typically encompasses multiple testing dimensions — functional verification, performance benchmarking, and basic security validation — depending on product type and risk profile. The practice increasingly relies on automation frameworks to execute regression and performance suites and can vary in scope from module-level validation of subsystems to full product-level end‑to‑end acceptance.
                  - paragraph [ref=e790]: Adoption will help teams reduce defect escape rate, post-delivery incidents, ensure environment reproducibility, and shorten customer acceptance cycles. The main challenge remains in balancing realistic test environments with efficient automation.
                - button "Read more about Factory acceptance testing" [ref=e791] [cursor=pointer]: Read more
                - link "View blip history" [ref=e793] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Factory%20acceptance%20testing
