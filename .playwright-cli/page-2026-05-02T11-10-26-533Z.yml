                    - text: should evaluate OpenSearch as a migration or new-workload option, not as a drop-in assumption.
                  - paragraph [ref=e1250]:
                    - text: Evaluate OpenSearch on bounded search or log analytics workloads before standardizing it. Validate API compatibility with existing Elasticsearch clients, index lifecycle and retention strategy, shard sizing, snapshot and restore to S3-compatible storage, security plugin configuration, and Kubernetes/operator maturity. For advanced observability use cases, compare it with the
                    - link "Grafana stack" [ref=e1251] [cursor=pointer]:
