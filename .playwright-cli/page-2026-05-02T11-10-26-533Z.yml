                  - generic: 28. Lakehouse
                - generic [ref=e889]:
                  - paragraph [ref=e890]:
                    - text: The
                    - strong [ref=e891]: lakehouse
                    - text: pattern collapses what used to be two stacks — a data lake for raw, semi-structured files and a data warehouse for curated, queryable tables — into a single architecture built on cheap object storage and open table formats. Formats such as
                    - link "Iceberg" [ref=e892] [cursor=pointer]:
                      - /url: Iceberg
                    - text: ","
                    - link "This is an external link. Opens in new tab" [ref=e893] [cursor=pointer]:
