              - generic [ref=e945]:
                - button [ref=e946] [cursor=pointer]:
                  - generic: 29. Multi-Agent Workflows
                - generic [ref=e947]:
                  - paragraph [ref=e948]:
                    - text: Multi-agent workflows — what ThoughtWorks now describes as a
                    - link "This is an external link. Opens in new tab" [ref=e949] [cursor=pointer]:
                      - /url: https://www.thoughtworks.com/radar/techniques/team-of-coding-agents
                      - text: team of coding agents
                    - text: — are an emerging way to tackle non-trivial coding tasks by orchestrating a small set of role-specific agents rather than relying on a single generalist. A primary orchestrator decomposes the work, sequences and parallelises subtasks, and the role-specific agents (for example a backend implementer, a frontend implementer and a reviewer) collaborate both with the orchestrator and with each other. Subagent support is rapidly becoming a baseline feature in coding tools, and recent releases such as Claude Code's agent teams provide built-in orchestration that lowers the barrier to trying this pattern.
                  - paragraph [ref=e950]: "It is worth being precise about scale. A deliberate team of a handful of agents is a very different beast from a fully autonomous swarm of dozens or hundreds of agents — the latter has a much higher entry cost, weaker quality signals and a different failure mode. In our context, \"multi-agent\" is closer to the team-of-agents end of the spectrum: small, well-defined roles, a human still on the loop, and clear hand-offs. Useful starting use cases are review/implement splits and clean backend/frontend separation; we recommend assessing it on a bounded internal task before reaching for swarm-scale orchestrations."
                - button "Read more about Multi-Agent Workflows" [ref=e951] [cursor=pointer]: Read more
                - link "View blip history" [ref=e953] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Multi-Agent%20Workflows
