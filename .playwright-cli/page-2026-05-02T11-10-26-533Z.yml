              - generic [ref=e605]:
                - button [ref=e606] [cursor=pointer]:
                  - generic: 13. Feedback Loops for Agents
                - generic [ref=e607]:
                  - paragraph [ref=e608]:
                    - text: Coding agents become dramatically more useful — and far less expensive for their human reviewers — when the same deterministic quality gates we already trust (compilers, linters, type checkers, structural tests, unit and integration suites) are wired directly into the agent's loop. Instead of waiting for a human to notice a broken build or a failing test in review, the agent observes the failure itself and self-corrects, producing cleaner output before any commit lands. This is the core idea behind ThoughtWorks'
                    - link "This is an external link. Opens in new tab" [ref=e609] [cursor=pointer]:
                      - /url: https://www.thoughtworks.com/radar/techniques/feedback-sensors-for-coding-agents
                      - text: feedback sensors for coding agents
                    - text: ": treat established checks as a backpressure mechanism that the agent can read."
                  - paragraph [ref=e610]: In practice, teams wire this up in a few different shapes — a reviewer agent that runs checks and triggers corrections, a long-running companion process the agent can query, or a thin CLI the agent invokes between edits. Coding agents also lower the cost of authoring custom linters and structural assertions, so the catalogue of feedback the agent receives can grow with the team's conventions. Whenever possible, these checks should run during the coding session, not as a post-commit afterthought. The further the failure signal is from the agent's working context, the less of it actually closes the loop.
                - button "Read more about Feedback Loops for Agents" [ref=e611] [cursor=pointer]: Read more
                - link "View blip history" [ref=e613] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Feedback%20Loops%20for%20Agents
                  - generic [ref=e614]: View blip history
            - listitem [ref=e616]:
              - generic [ref=e617]:
                - button [ref=e618] [cursor=pointer]:
                  - generic: 14. Infrastructure as Code
                - paragraph [ref=e620]:
                  - link "This is an external link. Opens in new tab" [ref=e621] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Infrastructure_as_code
                    - text: Infrastructure as Code
                  - text: "expresses compute, network, storage, and platform configuration as versioned, reviewable code. Declarative definitions produce reproducible environments, reduce configuration drift, and make changes auditable. Provisioning tools such as Terraform manage cloud and on-prem resources, while Ansible and image builders like Packer configure operating systems and middleware. Kubernetes manifests are packaged with Helm or shaped with Kustomize and reconciled by GitOps controllers such as Argo CD or Flux. Guardrails arise naturally from the workflow: pull requests, automated plans, policy checks, and continuous reconciliation highlight unintended changes before they reach production. Secrets remain outside version control in a vault or KMS, and remote state backends provide locking and encryption. The result is faster recovery through re-creation, consistent environments across data centers, and a clear change history that satisfies operational and compliance needs."
                - button "Read more about Infrastructure as Code" [ref=e622] [cursor=pointer]: Read more
                - link "View blip history" [ref=e624] [cursor=pointer]:
                  - /url: /?version=2026.04&blip=Infrastructure%20as%20Code
