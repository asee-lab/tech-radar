                - button [ref=e1502] [cursor=pointer]:
                  - generic: 52. Redis
                - paragraph [ref=e1504]:
                  - link "This is an external link. Opens in new tab" [ref=e1505] [cursor=pointer]:
                    - /url: https://redis.io/
                    - text: Redis
                  - text: "is our low-latency accelerator for caching, counters, lightweight queues, sessions, and rate limits—not a source of truth. We run it on Kubernetes with an operator and treat placement as a resilience tool: leaders are spread, followers are kept on different nodes, and pods are balanced to avoid single-node risk. The main lessons are conceptual: design for bounded memory so structures never grow without limits; choose a sensible eviction strategy and avoid wide, blocking scans. Optimize client behavior by pooling connections, batching with pipelining, and reducing hot-key contention. Keep production safe with strict command hygiene and access control, preferring iterative scans over risky commands. Be intentional about persistence, selecting cache-only or append-only/snapshot modes based on recovery needs rather than habit. Build in security and isolation from the start, and observe everything—latency, throughput, memory health, replication—so drift triggers timely alerts. Finally, codify these practices in scheduling rules, resource sizing, and simple restore drills to keep Redis fast, predictable, and boring."
                - button "Read more about Redis" [ref=e1506] [cursor=pointer]: Read more
