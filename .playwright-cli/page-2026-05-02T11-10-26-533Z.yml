                  - generic: 4. AI for requirements
                - generic [ref=e229]:
                  - paragraph [ref=e230]: Generative AI is collapsing the early stages of product development — requirements articulation, UI exploration, and prototyping — from a multi-week, multi-role process into hours, sometimes a single working session.
                  - paragraph [ref=e231]: "We see three complementary patterns:"
                  - list [ref=e232]:
                    - listitem [ref=e233]:
                      - strong [ref=e234]: Articulating requirements
                      - text: ": BAs and PMs combine general-purpose LLMs ("
                      - link "This is an external link. Opens in new tab" [ref=e235] [cursor=pointer]:
                        - /url: https://chatgpt.com
                        - text: ChatGPT
                      - text: ","
                      - link "This is an external link. Opens in new tab" [ref=e236] [cursor=pointer]:
                        - /url: https://claude.ai
                        - text: Claude
                      - text: ) with productivity AI embedded in their tools (
                      - link "This is an external link. Opens in new tab" [ref=e237] [cursor=pointer]:
                        - /url: https://www.atlassian.com/software/rovo
                        - text: Atlassian Rovo
                      - text: ","
                      - link "This is an external link. Opens in new tab" [ref=e238] [cursor=pointer]:
                        - /url: https://www.notion.com/product/ai
                        - text: Notion AI
                      - text: ) and purpose-built platforms like
                      - link "This is an external link. Opens in new tab" [ref=e239] [cursor=pointer]:
                        - /url: https://www.aha.io/
                        - text: Aha!
                      - text: ","
                      - link "This is an external link. Opens in new tab" [ref=e240] [cursor=pointer]:
                        - /url: https://www.productboard.com/
                        - text: Productboard
                      - text: ","
                      - link "This is an external link. Opens in new tab" [ref=e241] [cursor=pointer]:
                        - /url: https://linear.app/
                        - text: Linear
                      - text: ", or"
                      - link "This is an external link. Opens in new tab" [ref=e242] [cursor=pointer]:
                        - /url: https://www.scopemaster.com/
                        - text: ScopeMaster
                      - text: — turning raw ideas into well-formed user stories (applying INVEST to story shape and
                      - link "This is an external link. Opens in new tab" [ref=e243] [cursor=pointer]:
                        - /url: https://cucumber.io/docs/gherkin/
                        - text: Gherkin
                      - text: for acceptance criteria), running adversarial reviews ("what could go wrong here?"), and synthesizing stakeholder interviews into themes and open questions through research-focused tools like
