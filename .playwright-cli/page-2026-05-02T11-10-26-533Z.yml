                    - link "This is an external link. Opens in new tab" [ref=e1424] [cursor=pointer]:
                      - /url: https://iceberg.apache.org/
                      - text: Apache Iceberg
                    - text: is an open table format that brings database-like guarantees to data stored in object stores and data lakes. It supports schema evolution, partition evolution, snapshots, time travel, and safer concurrent writes, making it attractive for lakehouse architectures where multiple engines need to read and write the same analytical tables. The architectural benefits are strong, but adoption requires clear ownership of catalogs, compaction, retention, and governance.
                  - paragraph [ref=e1425]:
                    - text: Evaluate Iceberg together with
