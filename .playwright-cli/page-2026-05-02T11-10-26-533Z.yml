                  - paragraph [ref=e318]:
                    - text: We are placing this practice in
                    - strong [ref=e319]: Adopt
                    - text: "because teams that combine these patterns get broader test coverage with less manual effort, and move faster from a failed run to a fixed defect. The caveats stay: AI-generated tests can pass for the wrong reasons, auto-triage can hide real regressions, and AI-authored test code without proper review adds to"
                    - link "Codebase Cognitive Debt" [ref=e320] [cursor=pointer]:
