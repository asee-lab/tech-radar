                - paragraph [ref=e1373]:
                  - link "This is an external link. Opens in new tab" [ref=e1374] [cursor=pointer]:
                    - /url: https://bun.sh/
                    - text: Bun
                  - text: is a JavaScript and TypeScript runtime, package manager, bundler and test runner built on JavaScriptCore and a native toolchain written in Zig. It targets the same workloads as
                  - strong [ref=e1375]: Node.js
                  - text: "but ships them as a single fast binary: bun install, bun run and bun test, with a built-in bundler and transpiler that handle TypeScript and JSX out of the box. Compatibility with the Node.js API surface and npm registry is a primary design goal, so most existing packages and scripts work unchanged. We are putting it in"
                  - strong [ref=e1376]: Assess
                  - text: because the headline benefits—much faster install and startup times, native TypeScript, and a unified toolchain—are visible on day one, but the production track record inside our portfolio is still limited. Anywhere we already run Node.js (services, scripts, build tooling, developer CLIs) Bun is worth evaluating; what to validate is API compatibility for the specific Node libraries we depend on (native addons, streams, framework integrations), production stability and observability (profiling, OpenTelemetry, APM agents), and behaviour under realistic load. Until at least one non-trivial workload runs on Bun in production, Node.js remains the default and Bun is a deliberate, scoped experiment alongside it.
