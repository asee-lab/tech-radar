            - listitem [ref=e827]:
              - generic [ref=e828]:
                - button [ref=e829] [cursor=pointer]:
                  - generic: 25. OSS license checks
                - generic [ref=e830]:
                  - paragraph [ref=e831]:
                    - text: With frequent changes of licenses in open-source projects and LLM tools producing snippets they learned from open codebases, open-source license compliance is becoming a necessary part of continuous delivery pipelines. Modern tools like
                    - link "This is an external link. Opens in new tab" [ref=e832] [cursor=pointer]:
                      - /url: https://snyk.io/
                      - text: Snyk
                    - text: ","
                    - link "This is an external link. Opens in new tab" [ref=e833] [cursor=pointer]:
                      - /url: https://fossa.com/
                      - text: FOSSA
                    - text: ","
                    - link "This is an external link. Opens in new tab" [ref=e834] [cursor=pointer]:
                      - /url: https://github.com/nexB/scancode-toolkit
                      - text: ScanCode
                    - text: can detect non-compliant or risky licenses (GPL, AGPL, SSPL) before release. Integrating automated license verification into CI/CD protects us from downstream legal exposure and helps procurement vet third-party dependencies at scale.
                  - paragraph [ref=e835]: Teams should explorie policy-as-code enforcement to block merges or releases when high-risk licenses appear. The goal is to move license validation from manual review to a repeatable, auditable pipeline control, embedded in the same way we treat static analysis or vulnerability scans today. Over time this practice should become mature part of our secure software supply-chain posture — but adoption cost and scanning noise remain real challenges.
                - button "Read more about OSS license checks" [ref=e836] [cursor=pointer]: Read more
