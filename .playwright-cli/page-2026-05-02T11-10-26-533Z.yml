                      - /url: https://aquasecurity.github.io/trivy/
                      - text: Trivy
                    - text: is a comprehensive, open-source security scanner for containers, Kubernetes, infrastructure-as-code, and more. It has emerged as the
                    - strong [ref=e1944]: de-facto standard for scanning container images
                    - text: ", offering fast and reliable vulnerability detection with minimal configuration overhead. Trivy supports multiple sources (OS packages, language-specific dependencies, config files) and integrates easily into CI/CD workflows and developer tooling."
                  - paragraph [ref=e1945]:
                    - text: Beyond vulnerability scanning, Trivy also supports
                    - strong [ref=e1946]: Software Bill of Materials (SBOM) generation
                    - text: ", helping teams meet compliance, transparency, and traceability requirements for modern software supply chains. Its native support for SBOM formats such as SPDX and CycloneDX enables further tooling interoperability and regulatory alignment."
                  - paragraph [ref=e1947]:
                    - text: We place Trivy in the
                    - strong [ref=e1948]: Adopt
                    - text: ring due to its high usability, active development, and proven effectiveness in real-world use. Its broad protocol support, reliable results, and seamless DevSecOps integration make it a pragmatic choice for container security at scale. Trivy should be part of the standard toolkit for secure software delivery.
