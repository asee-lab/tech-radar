            - listitem [ref=e723]:
              - generic [ref=e724]:
                - button [ref=e725] [cursor=pointer]:
                  - generic: 19. Architecture as Code
                - generic [ref=e726]:
                  - paragraph [ref=e727]:
                    - text: Treating architecture as code means encoding the qualities we expect from a system — modularity, layering, dependency direction, performance budgets, security constraints — as executable checks that run in the same pipelines as our builds and tests. The idea draws on the
                    - link "This is an external link. Opens in new tab" [ref=e728] [cursor=pointer]:
                      - /url: https://www.thoughtworks.com/radar/techniques/architectural-fitness-function
                      - text: architectural fitness function
                    - text: concept popularised by
                    - link "This is an external link. Opens in new tab" [ref=e729] [cursor=pointer]:
                      - /url: https://www.thoughtworks.com/books/building-evolutionary-architectures
                      - text: Building Evolutionary Architectures
                    - text: ": an objective, automated assessment of one or more architectural characteristics, expressed through unit tests, structural rules, metrics or runtime monitors. Tools like"
                    - link "This is an external link. Opens in new tab" [ref=e730] [cursor=pointer]:
                      - /url: https://www.archunit.org/
                      - text: ArchUnit
                    - text: ","
                    - link "This is an external link. Opens in new tab" [ref=e731] [cursor=pointer]:
                      - /url: https://stoplight.io/open-source/spectral
                      - text: Spectral
                    - text: and module-boundary checks in frameworks such as
                    - link "This is an external link. Opens in new tab" [ref=e732] [cursor=pointer]:
                      - /url: https://spring.io/projects/spring-modulith
                      - text: Spring Modulith
                    - text: make it practical to express these rules alongside the code they govern.
                  - paragraph [ref=e733]:
                    - text: Encoding architecture this way pays off most where humans cannot keep up with the rate of change. As AI-assisted delivery accelerates output and contributes to
                    - link "Codebase Cognitive Debt" [ref=e734] [cursor=pointer]:
                      - /url: Codebase Cognitive Debt
                    - text: ", executable architectural rules become a continuous feedback channel that prevents drift before review. Combined with"
                    - link "Feedback Loops for Agents" [ref=e735] [cursor=pointer]:
                      - /url: Feedback Loops for Agents
                    - text: ", they let coding agents self-correct against the team's intended design instead of replicating whatever pattern they happen to find nearby."
                - button "Read more about Architecture as Code" [ref=e736] [cursor=pointer]: Read more
                - link "View blip history" [ref=e738] [cursor=pointer]:
