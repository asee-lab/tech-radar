                - button [ref=e2662] [cursor=pointer]:
                  - generic: 102. MediatR
                - generic [ref=e2663]:
                  - paragraph [ref=e2664]:
                    - text: MediatR is a popular open-source .NET library that implements the
                    - link "This is an external link. Opens in new tab" [ref=e2665] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Mediator_pattern
                      - text: Mediator pattern
                    - text: for in-process messaging, often used to help enforce Command Query Responsibility Segregation (
                    - link "CQRS" [ref=e2666] [cursor=pointer]:
                      - /url: CQRS
                    - text: ) and vertical slice architecture. It decouples the request sender (e.g., a controller) from the request handler (the business logic) by routing commands and queries to their respective single handlers, and publishing notifications to multiple handlers. This separation aims to reduce controller "constructor explosion" and enforce the Single Responsibility Principle.
                  - paragraph [ref=e2667]: MediatR has recently transitioned from a fully permissive open-source license (MIT) to a dual-license model (Reciprocal Public License 1.5/Commercial).
                - button "Read more about MediatR" [ref=e2668] [cursor=pointer]: Read more
