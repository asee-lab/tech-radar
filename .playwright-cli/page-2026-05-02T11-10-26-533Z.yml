                - button [ref=e1093] [cursor=pointer]:
                  - generic: 36. Low CVE base images
                - generic [ref=e1094]:
                  - paragraph [ref=e1095]: Adopting low CVE base images like Alpine Linux in your container deployments is a strategic shift toward improved security. This approach significantly reduces the attack surface and eliminates unnecessary components in containerized production environments, also minimizes the memory and disk requirements.
                  - paragraph [ref=e1096]:
                    - text: Implementation Strategy
                    - text: Verify and audit current base images. Identify where container images are used. Using the base image add necessary components or choose an application specific image like java/nginx. Ensure all necessary dependencies are available in base package repositories
                  - paragraph [ref=e1097]: Application Notes Base images are minimal and do not contain the basic tools. If you are debugging the container, you may not find your network tool.
                  - paragraph [ref=e1098]: What options are available for low-CVE base images?
                  - text: Base Image Size (MB) Known CVEs (approx.) Notes Alpine 5-7 0-10 (minimal due to few packages) very mature Alpaquita Linux 3-4 0-5 (Alpine + patching) java optimized with BellSoft, free images, support commercial Debian Slim 70-80 50-100 (mostly low-severity) larger image Chainguard Wolfi (base) 1-15 0 (zero-CVE policy ) commercial general images, free tier available BusyBox 1-2 0-5 (ultra-minimal) no package manager, limited
                  - paragraph [ref=e1099]: Alpine Images are good enough with frequent updates. Commercial subscriptions can be considered for high compliance and customer facing environments.
