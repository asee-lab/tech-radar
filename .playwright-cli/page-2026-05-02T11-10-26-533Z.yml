                  - generic: 72. ZAP (OWASP ZAP)
                - generic [ref=e1957]:
                  - paragraph [ref=e1958]:
                    - link "This is an external link. Opens in new tab" [ref=e1959] [cursor=pointer]:
                      - /url: https://www.zaproxy.org/
                      - text: ZAP (Zed Attack Proxy)
                    - text: is a free, open source tool for
                    - link "This is an external link. Opens in new tab" [ref=e1960] [cursor=pointer]:
                      - /url: https://owasp.org/www-project-devsecops-guideline/latest/02b-Dynamic-Application-Security-Testing
                      - text: Dynamic Application Security Testing (DAST)
                    - text: and the de-facto standard in this domain. Part of the
                    - link "This is an external link. Opens in new tab" [ref=e1961] [cursor=pointer]:
                      - /url: https://owasp.org/
                      - text: OWASP ecosystem
                    - text: ", ZAP is one of the most widely used web application security scanners worldwide. It can find vulnerabilities in web applications and APIs by automatically crawling endpoints and scanning for issues like injection vulnerabilities, security misconfigurations, and other common security flaws."
                  - paragraph [ref=e1962]: ZAP offers both passive scanning (observing traffic for vulnerabilities) and active scanning (automated attacks on targets), backed by a rich set of plugins and an automation-friendly design. Teams in our organization use ZAP for API security testing and have scripted its REST API for integration into CI/CD pipelines. This allows developers to include ZAP scans in build or deployment workflows, performing continuous security checks without significant manual effort. So far, we have not encountered any notable limitations in ZAP’s capabilities, which speaks to its maturity and reliability as a go-to DAST solution.
                  - paragraph [ref=e1963]: We recommend moved OWASP ZAP from the Trial ring to the Adopt ring based on our positive internal experience, its proven value in improving application security, and the fact that it is a well-established and standardized tool in the security testing domain.
                  - paragraph [ref=e1964]: This move is also supported by the increasing regulatory focus on cybersecurity, secure software development, and continuous security testing. Regulations and frameworks such as DORA, CRA, and similar initiatives will require organizations to demonstrate stronger security controls, vulnerability management, and testing practices across the software development lifecycle.
                  - paragraph [ref=e1965]: For this reason, OWASP ZAP should not be treated only as an optional or experimental tool, but as a standard part of secure development practices. We recommend integrating ZAP into the software development lifecycle (SDLC) and aligning its usage with secure software development frameworks such as SSDF. This may include running automated ZAP scans as part of regular development, CI/CD, and QA processes.
                  - paragraph [ref=e1966]: By embedding ZAP into delivery pipelines, teams can identify vulnerabilities earlier, improve remediation speed, and strengthen a security-first mindset throughout the development process.
                - button "Read more about ZAP (OWASP ZAP)" [ref=e1967] [cursor=pointer]: Read more
