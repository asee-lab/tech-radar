                        - /url: /?version=2026.04&blip=Context%20Engineering
                        - generic [ref=e86]: Context Engineering
                        - generic [ref=e87]: adopt
            - listitem [ref=e88]:
              - generic [ref=e89]:
                - button [ref=e90] [cursor=pointer]:
                  - generic: 3. AI for development
                - generic [ref=e91]:
                  - paragraph [ref=e92]:
                    - text: AI for development extends and consolidates
                    - link "AI for code generation" [ref=e93] [cursor=pointer]:
                      - /url: ../../2025.10/PP/ai-for-code-generation.md
                    - text: "from the previous radar. What we tracked a year ago as boilerplate scaffolding and snippet completion has matured into a coherent engineering practice that also covers spec-driven flow, review, testing, and documentation — pulling several adjacent radar entries into a single way of working. The engineer's role is shifting with it: from typing each line toward"
                    - strong [ref=e94]: shaping intent, curating context, and approving outcomes
                    - text: .
                  - paragraph [ref=e95]: "We see five modalities, each meaningful on its own and stronger when combined:"
                  - list [ref=e96]:
                    - listitem [ref=e97]:
                      - strong [ref=e98]: Spec-driven development
                      - text: —
                      - link "Spec-driven development" [ref=e99] [cursor=pointer]:
                        - /url: ../../2025.10/PP/spec-driven-development.md
                      - text: treats a
                      - strong [ref=e100]: living spec
                      - text: (plain-language goals, constraints, acceptance criteria) as the source of truth for agents that
                      - strong [ref=e101]: plan → scaffold → implement → validate
                      - text: through pull requests and checks. Tooling spans IDE/CLI flows like
                      - link "This is an external link. Opens in new tab" [ref=e102] [cursor=pointer]:
                        - /url: https://kiro.dev/
                        - text: Kiro
                      - text: (requirements → design → tasks), GitHub's
                      - link "This is an external link. Opens in new tab" [ref=e103] [cursor=pointer]:
                        - /url: https://github.com/github/spec-kit/
                        - text: Spec Kit
                      - text: (constitution + specify/plan/tasks loop), and
                      - link "This is an external link. Opens in new tab" [ref=e104] [cursor=pointer]:
                        - /url: https://tessl.io/
                        - text: Tessl
                      - text: ", with similar patterns in"
                      - link "This is an external link. Opens in new tab" [ref=e105] [cursor=pointer]:
                        - /url: https://github.com/bmad-code-org/BMAD-METHOD
                        - text: BMAD
                      - text: and
                      - link "This is an external link. Opens in new tab" [ref=e106] [cursor=pointer]:
                        - /url: https://github.com/Fission-AI/OpenSpec
                        - text: OpenSpec
                      - text: . Teams typically operate along three maturity levels —
                      - emphasis [ref=e107]: spec-first
                      - text: (spec guides one change),
                      - emphasis [ref=e108]: spec-anchored
                      - text: (spec persists and evolves), and
                      - emphasis [ref=e109]: spec-as-source
                      - text: (humans mostly edit specs; code syncs to them) — keeping human approval gates while encoding non-negotiables in the spec itself.
                    - listitem [ref=e110]:
                      - strong [ref=e111]: Code generation
                      - text: — In a year, the practical default has moved from inline autocomplete and snippet scaffolding to
                      - strong [ref=e112]:
                        - link "AI coding assistants" [ref=e113] [cursor=pointer]:
                          - /url: AI coding assistants
                      - text: that read the repository, plan multi-file changes, run their own checks, and propose ready-to-review patches.
                      - link "This is an external link. Opens in new tab" [ref=e114] [cursor=pointer]:
                        - /url: https://www.anthropic.com/claude-code
                        - text: Claude Code
                      - text: ","
                      - link "This is an external link. Opens in new tab" [ref=e115] [cursor=pointer]:
                        - /url: https://github.com/openai/codex
                        - text: OpenAI Codex CLI
                      - text: ","
                      - link "This is an external link. Opens in new tab" [ref=e116] [cursor=pointer]:
                        - /url: https://github.com/features/copilot
                        - text: GitHub Copilot
                      - text: and
                      - link "This is an external link. Opens in new tab" [ref=e117] [cursor=pointer]:
                        - /url: https://cursor.com/
                        - text: Cursor
                      - text: are the common shapes. Treat generated code as a starting point — review it for correctness, security, and licence concerns, and lean on
                      - link "Feedback Loops for Agents" [ref=e118] [cursor=pointer]:
                        - /url: Feedback Loops for Agents
                      - text: so that compilers, linters, and tests catch failures inside the agent's loop rather than in human review.
                    - listitem [ref=e119]:
                      - strong [ref=e120]: Code review
                      - text: — Building on
                      - link "AI for code review" [ref=e121] [cursor=pointer]:
                        - /url: ../../2025.10/PP/ai-for-code-review.md
                      - text: ", our practice combines four modalities."
                      - strong [ref=e122]: IDE assistants
                      - text: flag issues during authoring.
                      - strong [ref=e123]: Native agent integrations
                      - text: post inline review comments directly on the PR — on
                      - link "GitHub" [ref=e124] [cursor=pointer]:
                        - /url: GitHub
                      - text: via
                      - link "This is an external link. Opens in new tab" [ref=e125] [cursor=pointer]:
                        - /url: https://code.claude.com/docs/en/github-actions
                        - text: Claude Code
                      - text: ","
                      - link "This is an external link. Opens in new tab" [ref=e126] [cursor=pointer]:
                        - /url: https://developers.openai.com/codex/integrations/github
                        - text: Codex
                      - text: and
                      - link "This is an external link. Opens in new tab" [ref=e127] [cursor=pointer]:
                        - /url: https://docs.github.com/en/copilot/using-github-copilot/code-review
                        - text: GitHub Copilot code review
                      - text: ; on on-premise
                      - link "GitLab" [ref=e128] [cursor=pointer]:
                        - /url: GitLab
                      - text: and
                      - link "Azure DevOps" [ref=e129] [cursor=pointer]:
                        - /url: Azure DevOps
                      - text: via
                      - link "This is an external link. Opens in new tab" [ref=e130] [cursor=pointer]:
                        - /url: https://code.claude.com/docs/en/gitlab-ci-cd
                        - text: Claude Code's GitLab CI/CD integration
                      - text: or Codex CLI pipeline jobs (with marketplace extensions on Azure DevOps).
                      - strong [ref=e131]: Developer-triggered skill-based review
                      - text: has engineers run Claude Code or Codex CLI locally with predefined PR-review
                      - link "Agent Skills" [ref=e132] [cursor=pointer]:
                        - /url: Agent Skills
                      - text: on their own merge or pull requests. Alongside these,
                      - strong [ref=e133]: in-house automated reviewer agents
                      - text: "operate against local repository checkouts and post structured findings back to the PR. A useful side-effect we exploit: the same review pass is asked to flag when the change requires a documentation update, keeping docs aligned with code. We deliberately avoid additional third-party SaaS PR bots (CodeRabbit, Greptile, Sourcery and similar) because we are not willing to broaden the set of services that see our source code beyond the AI coding assistants we already vet. None of this replaces SAST/DAST/SCA or secret scanning."
                    - listitem [ref=e134]:
                      - strong [ref=e135]: Unit test generation
                      - text: — Picking up
                      - link "AI for unit tests generation" [ref=e136] [cursor=pointer]:
                        - /url: ../../2025.10/PP/ai-for-unit-tests-generation.md
                      - text: ", AI is reliably good at filling test coverage"
                      - emphasis [ref=e137]: given a seed
                      - text: ": a handful of hand-written tests that establish the patterns and assertion style for the codebase. Teams encode that seed and the surrounding conventions as reusable"
                      - link "Agent Skills" [ref=e138] [cursor=pointer]:
                        - /url: Agent Skills
                      - text: ", so test generation behaves consistently across services instead of reinventing style on every prompt. Developers stay accountable for choosing"
                      - strong [ref=e139]: what
                      - text: to test — AI is a force multiplier on coverage and edge cases, not a substitute for thinking about the test spectrum. Unit tests are the developer-owned slice of testing; everything beyond — integration,
                      - link "Contract testing" [ref=e140] [cursor=pointer]:
                        - /url: Contract testing
                      - text: ", end-to-end, performance and exploratory testing with AI assistance — belongs to"
                      - link "AI for verification" [ref=e141] [cursor=pointer]:
                        - /url: AI for verification
                      - text: ", where the broader QA practice is described."
                    - listitem [ref=e142]:
                      - strong [ref=e143]: Documentation authoring
                      - text: —
                      - link "AI for documentation authoring" [ref=e144] [cursor=pointer]:
                        - /url: ../../2025.10/PP/ai-for-documentation-authoring.md
                      - text: "drafts user manuals, API references, ADRs, README updates, and inline comments, and performs gap analysis between code and existing docs. Concrete examples: deriving an OpenAPI description and SDK snippets from controllers, drafting an ADR from a sequence of related commits, summarizing release notes from PR titles, and turning a design discussion into a first-pass user-facing guide. Outputs are first drafts, not finished artefacts — humans still own voice, accuracy, and what"
                      - emphasis [ref=e145]: not
                      - text: to publish.
                  - paragraph [ref=e146]:
                    - text: The compounding effect matters more than any single modality. Spec-driven flows scope what code generation produces; review agents close the gap between intent and implementation; test generation and documentation authoring stay in sync because the same context surfaces both. AI for development sits in the middle of a wider arc —
                    - link "AI for requirements" [ref=e147] [cursor=pointer]:
                      - /url: AI for requirements
                    - text: shapes what to build, AI for development builds it, and
                    - link "AI for verification" [ref=e148] [cursor=pointer]:
                      - /url: AI for verification
                    - text: "confirms that it works — and it leans on foundations we adopt elsewhere on the radar:"
                    - link "Agentic Engineering" [ref=e149] [cursor=pointer]:
                      - /url: Agentic Engineering
                    - text: ","
                    - link "Context Engineering" [ref=e150] [cursor=pointer]:
                      - /url: Context Engineering
                    - text: ","
                    - link "Feedback Loops for Agents" [ref=e151] [cursor=pointer]:
                      - /url: Feedback Loops for Agents
                    - text: ","
                    - link "Progressive Context Disclosure" [ref=e152] [cursor=pointer]:
                      - /url: Progressive Context Disclosure
                    - text: ","
                    - link "Multi-Agent Workflows" [ref=e153] [cursor=pointer]:
                      - /url: Multi-Agent Workflows
                    - text: ", and a"
                    - link "Product Context Pack" [ref=e154] [cursor=pointer]:
                      - /url: Product Context Pack
                    - text: per product.
                  - paragraph [ref=e155]:
                    - text: We are moving this practice to
                    - strong [ref=e156]: Adopt
                    - text: "because teams that combine these modalities deliver faster, with fewer regressions, and onboard newcomers in days rather than weeks — though for junior engineers teams should consciously calibrate how much AI assistance is enabled, so coding fundamentals and a deep understanding of our product architecture still get learned rather than bypassed. The caveats stay: AI-generated code can be confidently wrong; review tools can hide risky changes when humans defer to them; coverage from AI-generated tests can mask shallow assertions; and accumulated AI-authored output without commensurate review accelerates"
                    - link "Codebase Cognitive Debt" [ref=e157] [cursor=pointer]:
                      - /url: Codebase Cognitive Debt
                    - text: . Teams should keep deterministic quality gates (linters, type checks, unit and integration tests, SAST/SCA, secret scanning) in the agent's loop, treat AI outputs as starting points for expert review, and respect company policy on what code, data, and IP may leave the boundary.
                - button "Read more about AI for development" [ref=e158] [cursor=pointer]: Read more
