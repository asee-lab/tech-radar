                  - generic: 26. Contract testing
                - generic [ref=e852]:
                  - paragraph [ref=e853]: Traditional integration tests spin up full environments and exercise multiple services simultaneously, which introduces heavy setup costs, long execution times, and high flakiness where a small environment or data issue can break dozens of tests.
                  - paragraph [ref=e854]:
                    - text: In contrast,
                    - strong [ref=e855]: contract tests
                    - text: "focus on the API agreements between services: consumers and/or providers define expectations, and each provider verifies that it still satisfies those expectations. Because these tests run in isolation with lightweight mocks or stubs, they detect compatibility issues early in CI pipelines without requiring full system orchestration."
                  - paragraph [ref=e856]:
                    - strong [ref=e857]: Consumer-driven contracts
                    - text: and tools such as
                    - link "This is an external link. Opens in new tab" [ref=e858] [cursor=pointer]:
                      - /url: https://pact.io/
                      - text: Pact
                    - text: let downstream consumers define assertions that are executed in provider flows. In addition,
                    - strong [ref=e859]: provider-driven
                    - text: contract flows validate backward compatibility with API conformance tests and contract change validation. Modern setups integrate contract tests into CI to flag breaking API changes early and publish verified contracts to registries like
                    - link "This is an external link. Opens in new tab" [ref=e860] [cursor=pointer]:
                      - /url: https://github.com/pact-foundation/pact_broker
                      - text: Pact Broker
                    - text: .
                  - paragraph [ref=e861]: "Teams should treat contract tests as executable documentation between squads and as input to release automation. The challenge is governance: versioning, schema evolution, and when to allow breaking changes."
