                  - paragraph [ref=e2578]:
                    - text: We place ApexCharts in the
                    - strong [ref=e2579]: Hold
                    - text: ring due to this licensing change. While technically still a capable library, the updated licensing model introduces
                    - strong [ref=e2580]: compliance, cost, and procurement overhead
                    - text: that makes it less attractive for continued or new usage in business contexts. Teams should
                    - strong [ref=e2581]: reconsider its use for new projects
