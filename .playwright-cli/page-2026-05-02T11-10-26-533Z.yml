          - list [ref=e995]:
            - listitem [ref=e996]:
              - generic [ref=e997]:
                - button [ref=e998] [cursor=pointer]:
                  - generic: 31. Codebase Cognitive Debt
                - generic [ref=e999]:
                  - paragraph [ref=e1000]:
                    - link "This is an external link. Opens in new tab" [ref=e1001] [cursor=pointer]:
                      - /url: https://margaretstorey.com/blog/2026/02/09/cognitive-debt/
                      - text: Codebase cognitive debt
                    - text: is the growing gap between a system's implementation and a team's shared understanding of how and why it works. As AI increases change velocity, especially with multiple contributors or
                    - link "Multi-Agent Workflows" [ref=e1002] [cursor=pointer]:
                      - /url: Multi-Agent Workflows
                    - text: ", teams can lose track of design intent and hidden coupling. This, combined with rising"
                    - link "This is an external link. Opens in new tab" [ref=e1003] [cursor=pointer]:
                      - /url: https://martinfowler.com/bliki/TechnicalDebt.html
                      - text: technical debt
                    - text: ", creates a reinforcing loop that makes systems progressively harder to reason about."
                  - paragraph [ref=e1004]: Weaker system understanding also reduces developer's ability to guide AI effectively, making it harder to anticipate edge cases and steer agents away from architectural pitfalls. Left unmanaged, teams reach a tipping point where small changes trigger unexpected failures, fixes introduce regressions and cleanup efforts increase risk instead of reducing it.
                  - paragraph [ref=e1005]:
                    - text: "Teams should avoid complacency with AI-generated code and adopt explicit countermeasures:"
