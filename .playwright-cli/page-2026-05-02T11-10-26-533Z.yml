                  - generic: 101. jQuery
                - generic [ref=e2647]:
                  - paragraph [ref=e2648]:
                    - link "This is an external link. Opens in new tab" [ref=e2649] [cursor=pointer]:
                      - /url: https://jquery.com/
                      - text: jQuery
                    - text: "is a JavaScript library that simplified DOM manipulation, event handling, and AJAX requests with cross-browser compatibility. It was a cornerstone of front-end development for over a decade, but the problems it solved are now handled by the platform itself: standardised DOM APIs, fetch, modern ECMAScript, and component-based frameworks like"
                    - link "This is an external link. Opens in new tab" [ref=e2650] [cursor=pointer]:
                      - /url: https://react.dev/
                      - text: React
                    - text: ","
                    - link "This is an external link. Opens in new tab" [ref=e2651] [cursor=pointer]:
                      - /url: https://vuejs.org/
                      - text: Vue
                    - text: ","
                    - link "This is an external link. Opens in new tab" [ref=e2652] [cursor=pointer]:
                      - /url: https://angular.dev/
                      - text: Angular
                    - text: and Svelte. Carrying jQuery alongside a modern framework adds bundle size, duplicates paradigms, and lets direct DOM mutation fight the framework's reconciliation, leading to subtle bugs and degraded performance. Its plugin ecosystem is also a recurring source of XSS and prototype-pollution advisories, and many plugins are no longer maintained.
                  - paragraph [ref=e2653]:
                    - text: Our position is
                    - strong [ref=e2654]: Hold and plan removal
                    - text: ": no new code on jQuery, including in legacy screens; teams owning applications that still depend on it should put a concrete migration plan in place—replacing plugins with framework-native components, $.ajax with fetch/axios, and selectors with standard DOM APIs—and treat the remaining usage as technical debt with an owner and a target removal date rather than a permanent state."
                - button "Read more about jQuery" [ref=e2655] [cursor=pointer]: Read more
                - link "View blip history" [ref=e2657] [cursor=pointer]:
